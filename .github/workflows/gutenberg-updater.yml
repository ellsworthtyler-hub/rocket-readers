name: Rocket Readers Gutenberg Updater

on:
  schedule:
    - cron: '0 9 * * *'     # 9 AM UTC
    - cron: '0 21 * * *'    # 9 PM UTC
  workflow_dispatch:        # Manual trigger

jobs:
  update-gutenberg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Python_Script_Requirements.txt

      - name: Run Gutenberg Updater
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u rr_gutenberg_updater.py

      - name: Show full log if failed
        if: failure()
        run: echo "Python script failed - check the step above for the exact error"
